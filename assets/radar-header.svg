<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d">
<title id="t">Виталий Кутузов · QA / Web / AI</title><desc id="d">Анимированная техническая композиция: орбиты, поток сигналов и терминал. От пользовательского сценария до деталей реализации.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d15"/><stop offset="1" stop-color="#142332"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#38efd2" stop-opacity=".16"/><stop offset="1" stop-color="#38efd2" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8ba4c5" stroke-opacity=".08"/></pattern>
<linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="1080" y2="0"><stop stop-color="#50efd5" stop-opacity="0"/><stop offset=".5" stop-color="#50efd5"/><stop offset="1" stop-color="#50efd5" stop-opacity="0"/></linearGradient>
<style>
.radar-sweep{transform-origin:0px 0px;animation:radar-sweep 6s linear infinite}@keyframes radar-sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.orbit{transform-origin:872px 203px;animation:orbit 24s linear infinite}.reverse{animation-direction:reverse;animation-duration:36s}.dash{stroke-dasharray:5 13;animation:dash 8s linear infinite}.cursor{animation:blink 1.2s step-end infinite}.scan{animation:scan 6s linear infinite}.signal{animation:pulse 4s ease-in-out infinite}.two{animation-delay:1.3s}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.25}}@keyframes scan{0%{transform:translateY(70px);opacity:0}8%{opacity:.85}88%{opacity:.85}100%{transform:translateY(400px);opacity:0}}
@media(prefers-reduced-motion:reduce){.radar-sweep,.orbit,.dash,.cursor,.scan,.signal{animation:none}.scan{opacity:0}}
</style></defs>
